name: Build dual ICM-45686 test UF2

on:
  push:
    branches:
      - main
      - improve/imu-calibration-ds4-1khz
      - fix/tdk-verified-icm45686
      - test/swap-x-y
      - test/swap-z-y
      - test/gyro-noise-filter
    paths:
      - 'DGB_Firmware_ICM45686_source.zip'
      - '.github/workflows/build-test-uf2.yml'
      - 'firmware-overrides/**'
      - 'patches/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out test branch
        uses: actions/checkout@v4

      - name: Host regression tests
        run: scripts/test-host.sh

      - name: Install pinned toolchain
        run: scripts/setup-toolchain.sh

      - name: Compile and verify UF2
        run: scripts/build-firmware.sh

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: DGB_ICM45686_TEST_UF2
          path: build/*.uf2
          if-no-files-found: error
